name: CI og deploy

# main     = den rigtige app:  https://hand6erg.github.io/workout-tracker/
# staging  = testversionen:    https://hand6erg.github.io/workout-tracker/staging/
# Begge udgives sammen fra main-kørslen, fordi GitHub Pages kun har én side pr. repo.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loeft
          POSTGRES_PASSWORD: loeft
          POSTGRES_DB: loeft_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U loeft -d loeft_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://loeft:loeft@localhost:5433/loeft_test
      - name: Build Docker image
        run: docker build -t loeft-api .

  # Når staging er grøn, startes en main-kørsel, som udgiver både main og staging.
  udgiv-staging:
    needs: [test, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  byg-side:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Byg main
        working-directory: main
        run: npm ci && npm run build
      - name: Byg staging (egne testdata)
        working-directory: staging
        run: npm ci && npm run build
        env:
          VITE_STAGING: '1'
          VITE_STORAGE_KEY: loeft-state-staging-v1
      - run: |
          mkdir site
          cp -r main/dist/. site/
          mkdir site/staging
          cp -r staging/dist/. site/staging/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Kræver at Pages er slået til: Settings → Pages → Source: GitHub Actions.
    needs: byg-side
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
