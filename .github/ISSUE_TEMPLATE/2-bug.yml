name: 🐞 Bug
description: Something doesn't work as it should
labels: ["bug", "ready"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Danish is fine.
      placeholder: E.g. "The rest timer didn't start after the second set."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: device
    attributes:
      label: Phone / browser
      placeholder: E.g. iPhone 15, Safari
  - type: textarea
    id: images
    attributes:
      label: Screenshot (optional)
