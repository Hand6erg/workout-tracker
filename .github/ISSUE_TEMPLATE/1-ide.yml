name: 💡 New feature / idea
description: Something the app should be able to do
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should the app do?
      description: Describe it in your own words (Danish is fine). Short is fine.
      placeholder: E.g. "When I set a record, show a small celebration."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / when would you use it? (optional)
  - type: textarea
    id: images
    attributes:
      label: Images or examples (optional)
      description: Drag screenshots here, e.g. from another app you like.
  - type: markdown
    attributes:
      value: "Add the **ready** label when Claude may start building it."
